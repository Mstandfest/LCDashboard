version: '3.8'

services:
  backend:
    build: ./backend
    container_name: lcdashboard-backend
    restart: always
    env_file: .env
    networks:
      - dashboard-net

  nginx:
    image: nginx:alpine
    container_name: lcdashboard-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
